spring.application.name=HCTS
spring.config.import=optional:file:.env[.properties]

# Supabase Pooler Connection
# prepareThreshold=0: Supabase's transaction pooler (port 6543) does not support
# server-side prepared statements; without it, concurrent requests fail at random
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=postgres.erpbkweiifmpadmtxiiu
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings to auto-create tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Logging every SQL statement costs CPU and memory under load; set SHOW_SQL=false in production
spring.jpa.show-sql=${SHOW_SQL:true}

# schema.sql is a one-off migration applied manually with psql / Supabase SQL editor
spring.sql.init.mode=never

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

spring.security.oauth2.resourceserver.jwt.audiences=77072342847-2f0elr3bjc4og7h2jslo54pgcrk07t0r.apps.googleusercontent.com

app.auth.admin-emails=${ADMIN_EMAILS:}

# Supabase Storage (values come from .env)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}

# Complaint image uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Firebase Cloud Messaging: path to the service account JSON (value from .env).
# Leave empty to disable push notifications.
firebase.config.path=${FIREBASE_CONFIG_PATH:}

# --- Resource limits for a 512 MB container (Render free tier) ---
# Each Tomcat thread can hold a database connection and a request's working
# memory, so cap concurrency well below Tomcat's default of 200 threads.
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
# Requests queued when all threads are busy, and open connections kept;
# extra requests are refused instead of piling up in memory
server.tomcat.accept-count=50
server.tomcat.max-connections=200
# Drop clients that connect but send nothing / keep idle connections short
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=15s

# Small pool: each connection costs memory here and a slot on Supabase's
# pooler. Requests wait up to 5 s for a free connection, then fail fast.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000

# Real client IP behind Render's proxy (used by the rate limiter's IP fallback)
server.forward-headers-strategy=native
