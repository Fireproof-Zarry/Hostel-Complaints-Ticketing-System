# The all-in-one Docker image (root Dockerfile). Uses the PostgreSQL inside the container
# and demo data; never the real Supabase database, photo storage or push notifications.

spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/hostelfix
spring.datasource.username=postgres
spring.datasource.password=
spring.jpa.show-sql=false

# Off: they need the project's keys, which are not shipped in the image
supabase.url=
supabase.key=
firebase.config.path=

# Serve the React app from this server, so the page and the API share one address
app.serve-frontend=true
